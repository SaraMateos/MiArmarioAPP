name: mi_armario
description: Armario personal y outfits sin conexión para Android.
publish_to: none
version: 1.7.7+15
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  file_picker: ^10.3.3
  archive: ^4.0.7
  uuid: ^4.5.1
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
